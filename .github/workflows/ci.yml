name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # electron is only mocked by the tests; the binary is not needed.
  ELECTRON_SKIP_BINARY_DOWNLOAD: 1

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6.0.10
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run fmt:check
      - run: pnpm run lint
      - run: pnpm run typecheck
      - run: pnpm run test:coverage
      - run: pnpm audit --audit-level high
      - if: github.event_name == 'pull_request'
        run: pnpm exec commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose

  packed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6.0.10
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP"
      - run: |
          pnpm exec publint "$RUNNER_TEMP"/electron-fetcher-*.tgz --strict
          pnpm exec attw "$RUNNER_TEMP"/electron-fetcher-*.tgz --profile esm-only

  required:
    if: always()
    needs: [quality, packed]
    runs-on: ubuntu-latest
    steps:
      - env:
          QUALITY: ${{ needs.quality.result }}
          PACKED: ${{ needs.packed.result }}
        run: |
          for result in "$QUALITY" "$PACKED"; do
            test "$result" = success
          done
